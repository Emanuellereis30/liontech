<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liontech - Cadastro</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="overlay">
    <form class="form-container" id="formCadastro">
      <h1>Cadastro - LionTech</h1>
      <input type="text" id="nome" placeholder="Nome completo" required />
      <input type="date" id="dataNascimento" required />
      <select id="sexo">
        <option value="">Sexo</option>
        <option value="F">Feminino</option>
        <option value="M">Masculino</option>
      </select>
      <input type="text" id="nomeMaterno" placeholder="Nome da Mãe" required />
      <input type="text" id="cpf" placeholder="CPF" required />
      <input type="text" id="celular" placeholder="Celular (21)00000-0000" required />
      <input type="text" id="fixo" placeholder="Fixo (21)0000-0000" />
      <input type="text" id="endereco" placeholder="Endereço Completo" required />
      <input type="text" id="login" placeholder="Login (6 letras)" required />
      <input type="password" id="senha" placeholder="Senha (8 letras)" required />
      <input type="password" id="confirmaSenha" placeholder="Confirmar Senha" required />
      <button type="submit">Cadastrar</button>
      <div id="mensagemFeedback"></div>
    </form>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
