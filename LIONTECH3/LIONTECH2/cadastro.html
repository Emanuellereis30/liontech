<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liontech - Cadastro</title>
  <link rel="stylesheet" href="css/cadastro.css">

</head>
<body>
 <div class="container">
        <h2>Faça seu <span class="brand">Cadastro</span></h2>
        <form id="cadastroForm">
            <input type="text" id="nome" placeholder="Nome completo">
            <input type="date" id="dataNascimento">
            <select id="sexo">
                <option value="">Selecione o sexo</option>
                <option value="M">Masculino</option>
                <option value="F">Feminino</option>
            </select>
            <input type="text" id="nomeMaterno" placeholder="Nome Materno">
            <input type="text" id="cpf" placeholder="CPF">
            <input type="text" id="celular" placeholder="Telefone Celular (+55)XX-XXXXXXXX">
            <input type="text" id="fixo" placeholder="Telefone Fixo (+55)XX-XXXXXXXX">
            <input type="text" id="endereco" placeholder="Endereço Completo">
            <input type="text" id="login" placeholder="Login (6 letras)">
            <input type="password" id="senha" placeholder="Senha (8 letras)">
            <input type="password" id="confirmaSenha" placeholder="Confirma Senha">
            <button type="submit">CADASTRAR</button>
            <a href="principal.html" class="back-button">← Voltar</a>
        </form>
        <div id="mensagem" class="message"></div>
    </div>
  <script src="cadastro.js"></script>
</body>
</html>
