<body>

 <nav>

  <nav>
    <div class="search-bar">
      <input type="text" class="form-control" placeholder="Buscar produtos..." id="busca">
      <button class="btn btn-dark" onclick="buscarProduto()">Buscar</button>
    </div>
  </nav>

  <!-- SLIDE DESTAQUE COM BOOTSTRAP -->
  <div id="carouselExample" class="carousel slide my-4" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="img/slide1.png" class="d-block w-100" alt="Slide 1">
      </div>
      <div class="carousel-item">
        <img src="img/slide2.png" class="d-block w-100" alt="Slide 2">
      </div>
      <div class="carousel-item">
        <img src="img/slide3.png" class="d-block w-100" alt="Slide 3">
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Anterior</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Próximo</span>
    </button>
  </div>

  <main class="produtos" id="listaProdutos">
    <div class="produto" data-nome="Iphone 13">
      <img src="img/iphone13.png" alt="Iphone 13 128GB">
      <h3>Iphone 13 128GB</h3>
      <p>R$ 3.599,00</p>
      <button class="btn-comprar" onclick="adicionarCarrinho('Iphone 13', 3599.00)">Comprar</button>
    </div>
    <div class="produto" data-nome="Iphone 12 64GB Seminovo">
      <img src="img/iphone12.jpg" alt="Iphone 12">

      <p>R$ 1.899,00</p>
      <button class="btn-comprar" onclick="adicionarCarrinho('Iphone 12 Seminovo', 1899.00)">Comprar</button>
    </div>
    <div class="produto" data-nome="Smartwatch Série 8">
      <img src="img/watche.jpg" alt="Smartwatch">
      <h3>Smartwatch Série 8</h3>
      <p>R$ 2.990,90</p>
      <button class="btn-comprar" onclick="adicionarCarrinho('Smartwatch Série 8', 2990.90)">Comprar</button>
    </div>
  </main>
