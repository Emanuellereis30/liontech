<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
   <link rel="stylesheet" href="css/style.css">

</head>
<body>
      <header class="top-header">
    <div class="container">
      <a href="principal.html">
        <img src="img/fundo.png" alt="Logo da Loja" class="logo">
      </a>
   <nav>
      <a href="principal.html">Inicio</a>

      <a href="iphones_novos.html">Iphones Novos</a>
  
      <a href="# Seminovos">Seminovos</a>
  
      <a href="smartwatch.html">Smartwatches</a>

      <a href="#suporte">Suporte</a>
      
   </nav>
    </div>
  
  </header>
  <div class="top-bar">
    <a href="login.html" class="login"> <i class="fas fa-user"></i> Login </a>
    <a href="#" class="carrinho"><i>🛒</i> Carrinho</a>
  </div>

  <div class="login-container">
    <div class="login-card">
      <h2>Faça seu <span class="brand">Login</span></h2>
      <form onsubmit="return validarLogin()">
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="usuario" placeholder="nome do usuario" autocomplete="off" required>
          <label for="usuario">Login</label>
        </div>

    <div class="form-floating mb-3">
       <input type="email" class="form-control" id="email" placeholder="seuemail@exemplo.com" autocomplete="off" required>
       <label for="email">Email</label>
    </div>

        <div class="form-floating mb-3">
          <input type="password" class="form-control" id="senha" placeholder="Senha" autocomplete="off" required>
          <label for="senha">Senha</label>
        </div>

        <button type="submit" class="btn btn-warning w-100">Entrar</button>
        <a href="cadastro.html" class="btn btn-outline-light w-100 mt-3">Cadastrar Novo Usuário</a>
         <a href="smartwatch.html" class="btn btn-outline-secondary w-100 mt-3">← Voltar</a>
      </form>
    </div>
  </div>

  <script src="js/login.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</body>
</html>
